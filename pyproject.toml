[tool.poetry]
name = "future-vision-transport-api"
version = "0.1.0"
description = "API FastAPI de segmentation sémantique pour Future Vision Transport"
authors = ["Équipe R&D Future Vision Transport"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

# PyTorch CPU pour Heroku
torch = { version = "2.7.1", source = "pytorch-cpu" }

# Traitement image / tenseurs
numpy = "^2.0"
pillow = "^11.0"
opencv-python-headless = "^4.10"

# Architecture du modèle gagnant
keras = "3.15.1"
keras-hub = "0.30.0"

# API
fastapi = "^0.141.1"
uvicorn = "^0.52.1"
gunicorn = "^26.0.0"
uvicorn-worker = "^0.4.0"
python-multipart = "^0.0.32"
pydantic-settings = "^2.15.0"

# Ancien U-Net : installation locale explicite uniquement.
[tool.poetry.group.legacy]
optional = true

[tool.poetry.group.legacy.dependencies]
torchvision = { version = "0.22.1", source = "pytorch-cpu" }
segmentation-models-pytorch = "^0.5"
timm = "^1.0"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^8.0"
httpx = "^0.28"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
